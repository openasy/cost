# Cost. A pipeline sends the bill; Cost shows spend by team and tag, budgets, forecasts and anomalies (ADR 0051).
#
#   openssl rand -hex 32 > openasy-kek   # cost's key: sign-in secrets (ADR 0021). Keep it with your backups
#   docker compose up -d
#   docker compose logs cost | grep 'no owner yet'   # the one-time link that creates the owner account
services:
  cost:
    image: ghcr.io/openasy/cost:0.4.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:8080:8080" # UI and API; put a TLS proxy in front to reach it from elsewhere
    volumes:
      - cost-data:/data # SQLite database: spend, rules, budgets and anomalies
    secrets:
      - openasy-kek # mounted at /run/secrets/openasy-kek
    environment:
      # The address people open Cost at; with a TLS proxy in front, its https:// URL.
      COST_PUBLIC_URL: ${COST_PUBLIC_URL:-http://localhost:8080}
      # For the pipeline: it can send spend and nothing else. Or use an API token with the editor role from Settings.
      COST_INGEST_TOKEN: ${COST_INGEST_TOKEN:-}
      # Sign in with your identity provider (OIDC), see the README:
      # OPENASY_OIDC_ISSUER: https://login.example.com
      # OPENASY_OIDC_CLIENT_ID: cost
      # OPENASY_OIDC_CLIENT_SECRET: ${OPENASY_OIDC_CLIENT_SECRET}

volumes:
  cost-data:

secrets:
  openasy-kek:
    file: ./openasy-kek
